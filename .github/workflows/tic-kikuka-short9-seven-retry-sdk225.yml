name: TIC Kikuka Short9 Seven Lines Retries Gemini SDK 225
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-kikuka-short9-seven-retry-sdk225.yml'
permissions:
  contents: read
jobs:
  render:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        line: [1, 2, 3, 5, 7, 8, 9]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proven SDK 2.25.0
        run: python -m pip install 'google-genai==2.25.0'
      - name: Generate one approved line without accelerating speech
        env:
          LINE_INDEX: ${{ matrix.line }}
        shell: bash
        run: |
          python -u - <<'PY'
          import os,json,subprocess,sys,pathlib,hashlib,wave,time
          approved=json.loads(r'''["じゃがいもで菊の花！","四角く切り、四隅を落とす。","割り箸を両脇に置き、底を残して細く切る。","90度回して、もう一度切る。","塩水で花びらを開きやすくし、塩気は洗い流す。","水気を拭いて、でんぷん粉をまぶす。","150度の油で揚げる。","トマトソースをかけたら、","菊の花の完成！"]''')
          i=int(os.environ['LINE_INDEX']);text=approved[i-1];lid=f'a{i:02d}'
          out=pathlib.Path('voice_outputs/kikuka_short9_seven_retries')
          out.mkdir(parents=True,exist_ok=True)
          assert os.environ.get('GEMINI_API_KEY')
          style='成人男性、明るく力強い熱血系、絶叫せず、自然な速度で一文を明瞭に。早口禁止、倍速禁止、原稿変更禁止。指示文は読まない。'
          attempts=[('gemini-3.1-flash-tts-preview',155),('gemini-3.1-flash-tts-preview',155),('gemini-3.8-flash-tts',155),('gemini-2.5-flash-preview-tts',50)]
          errors=[]
          for j,(model,timeout) in enumerate(attempts,1):
              req=pathlib.Path('voice_requests')/f'tic_kikuka_final_{lid}_{j}.json';req.parent.mkdir(parents=True,exist_ok=True)
              req.write_text(json.dumps({'text':text,'profile':{'model':model,'voice_name':'Puck','style':style}},ensure_ascii=False),encoding='utf-8')
              print('TRY',lid,j,model,flush=True)
              try:
                  p=subprocess.run([sys.executable,'scripts/run_voice_request.py',str(req)],capture_output=True,text=True,timeout=timeout)
              except subprocess.TimeoutExpired:
                  errors.append({'attempt':j,'model':model,'error':'timeout'})
                  print('timeout',lid,j,flush=True);continue
              if p.returncode==0:
                  src=pathlib.Path('voice_outputs')/req.stem/'voice.wav'
                  if src.is_file() and src.stat().st_size>1000:
                      dst=out/f'{lid}.wav';dst.write_bytes(src.read_bytes())
                      with wave.open(str(dst),'rb') as w:duration=w.getnframes()/w.getframerate()
                      meta={'id':lid,'text':text,'model':model,'sdk':'google-genai==2.25.0','duration_sec':duration,'sha256':hashlib.sha256(dst.read_bytes()).hexdigest(),'status':'success'}
                      (out/f'{lid}.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                      print('SUCCESS',lid,duration,flush=True);break
              error=(p.stderr or p.stdout or '')[-650:]
              errors.append({'attempt':j,'model':model,'error':error})
              print('FAIL',lid,j,error[-150:],flush=True)
          else:
              (out/f'{lid}.json').write_text(json.dumps({'id':lid,'text':text,'status':'failure','errors':errors},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              raise RuntimeError('All attempts exhausted '+lid)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tic-kikuka-short9-line-${{ matrix.line }}
          path: voice_outputs/kikuka_short9_seven_retries/
          if-no-files-found: warn
          retention-days: 30
