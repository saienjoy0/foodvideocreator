name: TIC Hologram 08G Gemini Puck SDK 2.25.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-hologram-08g-sdk225.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned successful SDK
        run: python -m pip install 'google-genai==2.25.0'
      - name: Synthesize seven approved lines with Puck
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import json, os, pathlib, subprocess, sys, shutil, wave, time, hashlib
          approved = json.loads(r'''["えっ、スマホの上に花火が浮いてる！？","でもこれ、本物の立体映像じゃない！","秘密は透明なシート。光を少し反射する！","透明な容器に合う形にシートを切る。","ずれないよう、内側にテープで固定！","反射の角度が重要。45度は一つの目安！","スマホに載せると、花火が浮かぶ！"]''')
          profile = json.loads(r'''{"model":"gemini-3.8-flash-tts","voice_name":"Puck","style":"成人男性。工作・科学の驚きを伝えるYouTube Shortsナレーション。明るくエネルギッシュで、好奇心が伝わる親しみやすい中音。テンポよく、歯切れよく、非常にはっきりした日本語。最初の『えっ』には驚き、最後の『花火が浮かぶ』にはワクワク感を込める。過剰な絶叫や演技はしない。原稿の各文は一字一句変えずに読み、数字の『45度』は『よんじゅうごど』と自然に発音。"}''')
          assert len(approved)==7 and profile['voice_name']=='Puck'
          assert os.getenv('GEMINI_API_KEY'), 'GitHub secret missing'
          out=pathlib.Path('voice_outputs/tic_hologram_20261109_08g_sdk225')
          out.mkdir(parents=True,exist_ok=True)
          (out/'approved_script.txt').write_text('\n'.join(approved)+'\n',encoding='utf-8')
          manifest={'sdk':'google-genai==2.25.0','model':profile['model'],'voice':'Puck','text_sha256':hashlib.sha256('\n'.join(approved).encode()).hexdigest(),'lines':[]}
          for idx,script in enumerate(approved,1):
              lid=f'a{idx:02d}'
              req=pathlib.Path('voice_requests')/f'tic_hologram_20261109_sdk225_{lid}.json'
              req.write_text(json.dumps({'text':script,'profile':profile},ensure_ascii=False),encoding='utf-8')
              for attempt in range(1,4):
                  try:
                      p=subprocess.run([sys.executable,'scripts/run_voice_request.py',str(req)],capture_output=True,text=True,timeout=240)
                  except subprocess.TimeoutExpired:
                      print(f'TIMEOUT {lid} attempt {attempt}',flush=True)
                      continue
                  if p.returncode==0:
                      gen=pathlib.Path('voice_outputs')/req.stem/'voice.wav'
                      if gen.is_file() and gen.stat().st_size>1000:
                          shutil.copy2(gen,out/f'{lid}.wav')
                          with wave.open(str(out/f'{lid}.wav'),'rb') as w:
                              duration=w.getnframes()/w.getframerate()
                              meta={'id':lid,'text':script,'duration':round(duration,5),'rate':w.getframerate(),'channels':w.getnchannels(),'bytes':gen.stat().st_size}
                          manifest['lines'].append(meta)
                          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                          print(f'OK {lid} {duration:.3f} seconds',flush=True)
                          break
                  print(f'FAILED {lid} attempt {attempt}: {(p.stderr or "")[-650:]}',flush=True)
                  time.sleep(attempt*4)
              else:
                  raise SystemExit(f'TTS failed {lid}')
          assert len(manifest['lines']) == 7
          print('ALL 7 WAV GENERATED',flush=True)
          PY
      - name: Upload seven WAVs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-hologram-08g-gemini-sdk225
          path: voice_outputs/tic_hologram_20261109_08g_sdk225/
          if-no-files-found: error
          retention-days: 30
