name: TIC Hologram 08G Gemini Puck SDK 2.25.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-hologram-08g-sdk225.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned successful Gemini SDK
        run: python -m pip install 'google-genai==2.25.0'
      - name: Synthesize approved seven lines unchanged
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import json, os, pathlib, subprocess, sys, shutil, wave, time, hashlib
          payload = json.loads(r'''{
  "approved_lines": [
    "えっ、スマホの上に花火が浮いてる！？",
    "でもこれ、本物の立体映像じゃない！",
    "秘密は透明なシート。光を少し反射する！",
    "透明な容器に合う形にシートを切る。",
    "ずれないよう、内側にテープで固定！",
    "反射の角度が重要。45度は一つの目安！",
    "スマホに載せると、花火が浮かぶ！"
  ],
  "profile": {
    "model": "gemini-3.8-flash-tts",
    "voice_name": "Puck",
    "style": "成人男性。工作・科学の驚きを伝えるYouTube Shortsナレーション。明るくエネルギッシュで、好奇心が伝わる親しみやすい中音。テンポよく、歯切れよく、非常にはっきりした日本語。最初の『えっ』には驚き、最後の『花火が浮かぶ』にはワクワク感を込める。過剰な絶叫や演技はしない。原稿の各文は一字一句変えずに読み、数字の『45度』は『よんじゅうごど』と自然に発音。"
  }
}''')
          expected = [
            "えっ、スマホの上に花火が浮いてる！？",
            "でもこれ、本物の立体映像じゃない！",
            "秘密は透明なシート。光を少し反射する！",
            "透明な容器に合う形にシートを切る。",
            "ずれないよう、内側にテープで固定！",
            "反射の角度が重要。45度は一つの目安！",
            "スマホに載せると、花火が浮かぶ！"
          ]
          assert payload['approved_lines'] == expected, 'Transcript mismatch'
          assert payload['profile']['voice_name'] == 'Puck'
          assert payload['profile']['model'] == 'gemini-3.8-flash-tts'
          assert os.environ.get('GEMINI_API_KEY'), 'Missing repository secret'
          out=pathlib.Path('voice_outputs/tic_hologram_20261109_08g_sdk225')
          out.mkdir(parents=True,exist_ok=True)
          (out/'approved_script.txt').write_text('\n'.join(expected)+'\n',encoding='utf-8')
          manifest={'sdk':'google-genai==2.25.0','model':payload['profile']['model'],'voice':'Puck','text_sha256':hashlib.sha256('\n'.join(expected).encode('utf-8')).hexdigest(),'lines':[]}
          for index,script in enumerate(expected,1):
              lid=f'a{index:02d}'
              req=pathlib.Path('voice_requests')/f'tic_hologram_20261109_sdk225_{lid}.json'
              req.write_text(json.dumps({'text':script,'profile':payload['profile']},ensure_ascii=False,indent=2),encoding='utf-8')
              for attempt in range(1,4):
                  try:
                      proc=subprocess.run([sys.executable,'scripts/run_voice_request.py',str(req)],capture_output=True,text=True,timeout=260)
                  except subprocess.TimeoutExpired:
                      print(f'TIMEOUT {lid} attempt {attempt}',flush=True)
                      continue
                  if proc.returncode == 0:
                      generated=pathlib.Path('voice_outputs')/req.stem/'voice.wav'
                      if not generated.exists() or generated.stat().st_size <= 1000:
                          print(f'WAV MISSING {lid}',flush=True)
                          continue
                      shutil.copy2(generated,out/f'{lid}.wav')
                      with wave.open(str(out/f'{lid}.wav'),'rb') as w:
                          duration=w.getnframes()/w.getframerate()
                          meta={'id':lid,'text':script,'duration':round(duration,5),'rate':w.getframerate(),'channels':w.getnchannels(),'bytes':generated.stat().st_size}
                      manifest['lines'].append(meta)
                      (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                      print(f'OK {lid} {duration:.3f} seconds',flush=True)
                      break
                  print(f'FAILED {lid} attempt {attempt}: {(proc.stderr or "")[-650:]}',flush=True)
                  time.sleep(attempt*4)
              else:
                  raise SystemExit(f'TTS could not generate {lid}')
          assert len(manifest['lines']) == 7
          print('ALL 7 WAV GENERATED',flush=True)
          PY
      - name: Upload voice artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-hologram-08g-gemini-sdk225
          path: voice_outputs/tic_hologram_20261109_08g_sdk225/
          if-no-files-found: error
          retention-days: 30
