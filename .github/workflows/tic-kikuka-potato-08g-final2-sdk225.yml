name: TIC Chrysanthemum Potato 08G Final Two WAV Rescue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-kikuka-potato-08g-final2-sdk225.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install google-genai pinned
        run: python -m pip install 'google-genai==2.25.0'
      - name: Synthesize exactly the two missing approved lines with Puck
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import json,os,pathlib,subprocess,sys,shutil,wave,time
          from concurrent.futures import ThreadPoolExecutor,as_completed
          rows=json.loads("[{\"id\":\"a06\",\"text\":\"塩水で柔らかくして、花びらを開きやすくする。塩気は水で洗い流す。\"},{\"id\":\"a09\",\"text\":\"150度の油で、形を崩さず揚げる。\"}]")
          style=json.loads("\"成人男性の料理ショート動画ナレーター。力強く明るく熱血、聞き取りやすい中音、テンポ良く歯切れよい日本語。叫ばない。本文を足さず削らず句読点・文字列を変えずに読む。150度は『ひゃくごじゅうど』と発音。\"")
          assert os.getenv('GEMINI_API_KEY')
          out=pathlib.Path('voice_outputs/tic_kikuka_potato_20261110_final2')
          out.mkdir(parents=True,exist_ok=True)
          def gen(row):
              lid,txt=row['id'],row['text']
              for attempt in range(1,5):
                  req=pathlib.Path('voice_requests')/f'tic_kikuka_potato_final2_{lid}_{attempt}.json'
                  profile={'model':'gemini-3.1-flash-tts-preview','voice_name':'Puck','style':style}
                  req.write_text(json.dumps({'text':txt,'profile':profile},ensure_ascii=False),encoding='utf-8')
                  try:
                      p=subprocess.run([sys.executable,'scripts/run_voice_request.py',str(req)],capture_output=True,text=True,timeout=90)
                  except subprocess.TimeoutExpired:
                      print(f'TIMEOUT {lid} attempt={attempt}',flush=True)
                      time.sleep(2*attempt)
                      continue
                  if p.returncode==0:
                      src=pathlib.Path('voice_outputs')/req.stem/'voice.wav'
                      if src.is_file() and src.stat().st_size>1000:
                          shutil.copy2(src,out/f'{lid}.wav')
                          with wave.open(str(out/f'{lid}.wav'),'rb') as w: dur=w.getnframes()/w.getframerate()
                          print(f'OK {lid} {dur:.3f}s',flush=True)
                          return {'id':lid,'text':txt,'model':profile['model'],'duration_sec':round(dur,6),'bytes':src.stat().st_size}
                  print(f'FAILED {lid}: {(p.stderr or "")[-280:]}',flush=True)
                  time.sleep(2*attempt)
              return {'id':lid,'failed':True}
          m={'sdk':'google-genai==2.25.0','voice_name':'Puck','model':'gemini-3.1-flash-tts-preview','lines':[],'failed':[]}
          with ThreadPoolExecutor(max_workers=2) as ex:
              futures=[ex.submit(gen,r) for r in rows]
              for f in as_completed(futures):
                  result=f.result()
                  m['failed' if result.get('failed') else 'lines'].append(result)
                  (out/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          if len(m['lines'])!=2: raise SystemExit('TTS INCOMPLETE')
          print('SUCCESS BOTH MISSING WAVS',flush=True)
          PY
      - name: Upload final two WAVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-kikuka-potato-08g-final2-sdk225
          path: voice_outputs/tic_kikuka_potato_20261110_final2/
          if-no-files-found: error
          retention-days: 30
