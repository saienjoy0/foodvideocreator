name: TIC Egg Sticks 08G Rescue SDK 2.25.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-egg-sticks-08g-rescue-sdk2250.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proven pinned SDK 2.25.0
        run: python -m pip install -q 'google-genai==2.25.0'
      - name: Generate approved 11 lines with model probe and fallback
        timeout-minutes: 24
        shell: bash
        run: |
          set -o pipefail
          mkdir -p voice_outputs/tic_egg_sticks_20261110_08g_rescue
          python -u scripts/tic_egg_sticks_08g_rescue.py 2>&1 | tee voice_outputs/tic_egg_sticks_20261110_08g_rescue/run.log
      - name: Upload WAVs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-voice-egg-sticks-20261110-rescue
          path: voice_outputs/tic_egg_sticks_20261110_08g_rescue/
          retention-days: 30
          if-no-files-found: error
