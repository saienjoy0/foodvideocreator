name: Materialize fixed BGM

on:
  push:
    branches:
      - implementation/v1.6.2
    paths:
      - 'assets/fixed_bgm.parts/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all parts are present
        id: parts
        shell: bash
        run: |
          count=$(find assets/fixed_bgm.parts -maxdepth 1 -name 'part_*.b64' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count parts"
      - name: Reconstruct and verify MP3
        if: steps.parts.outputs.count == '11'
        shell: bash
        run: |
          cat $(find assets/fixed_bgm.parts -maxdepth 1 -name 'part_*.b64' | sort) | base64 --decode > assets/fixed_bgm.MP3
          echo '0c6625282b69f829b057086e8e37b8baa3f77e7b3b094e372dac89ac78abcdf8  assets/fixed_bgm.MP3' | sha256sum -c -
          test -s assets/fixed_bgm.MP3
      - name: Commit production BGM
        if: steps.parts.outputs.count == '11'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/fixed_bgm.MP3
          git rm -r assets/fixed_bgm.parts
          git commit -m 'chore: materialize fixed production BGM'
          git push origin HEAD:implementation/v1.6.2
