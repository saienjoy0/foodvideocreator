name: Lotus Pastry Gemini TTS Fallback
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lotus-pastry-tts-fallback.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Gemini SDK
        run: python -m pip install 'google-genai>=2.25.0'
      - name: Generate approved voice
        run: python scripts/run_voice_request.py voice_requests/lotus_pastry_20261026_male_hotblood_legacy.json
      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotus-pastry-gemini-fallback
          path: voice_outputs/lotus_pastry_20261026_male_hotblood_legacy/
          if-no-files-found: error
          retention-days: 30
