name: TIC Acorn Tofu 08G SDK225
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-acorn-tofu-08g-20261122.yml'
permissions:
  contents: write
concurrency:
  group: tic-acorn-tofu-08g-20261122
  cancel-in-progress: false
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: |
        ${{ secrets.GEMINI_API_KEY }}
        ${{ secrets.GEMINI_API_KEY_1 }}
        ${{ secrets.GEMINI_API_KEY_2 }}
        ${{ secrets.GEMINI_API_KEY_3 }}
        ${{ secrets.GEMINI_API_KEY_4 }}
        ${{ secrets.GEMINI_API_KEY_5 }}
        ${{ secrets.GEMINI_API_KEY2 }}
        ${{ secrets.GEMINI_API_KEY3 }}
        ${{ secrets.GEMINI_API_KEY4 }}
        ${{ secrets.GEMINI_API_KEY5 }}
        ${{ secrets.GEMINI_API_KEY_SUB }}
        ${{ secrets.GEMINI_API_KEY_BACKUP }}
        ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install exact successful Gemini SDK
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q 'google-genai==2.25.0'
          .venv/bin/python -c 'import importlib.metadata; assert importlib.metadata.version("google-genai") == "2.25.0"'
      - name: Validate secret and approved 19 lines
        run: |
          test -n "$GEMINI_API_KEY"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("voice_batches/tic_acorn_tofu_20261122_08g_v1.json").read_text())
          assert len(data["lines"])==19
          assert data["profile"]["voice_name"]=="Puck"
          PY
      - name: Generate all 19 separate WAV clips without speeding speech
        run: |
          mkdir -p voice_outputs/tic_acorn_tofu_20261122_08g_v1
          set -o pipefail
          .venv/bin/python -u scripts/run_voice_batch.py voice_batches/tic_acorn_tofu_20261122_08g_v1.json 2>&1 | tee voice_outputs/tic_acorn_tofu_20261122_08g_v1/run.log
      - name: Upload all WAVs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-voice-batch-tic_acorn_tofu_20261122_08g_v1
          path: voice_outputs/tic_acorn_tofu_20261122_08g_v1/
          if-no-files-found: warn
          retention-days: 30
