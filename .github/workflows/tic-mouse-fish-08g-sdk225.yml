name: TIC Mouse Fish 08G Gemini TTS SDK225 Puck retry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-mouse-fish-08g-sdk225.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin SDK exactly
        run: python -m pip install 'google-genai==2.25.0'
      - name: Generate approved lines using resilient TTS requests
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, shutil, subprocess, sys, wave
          approved = json.loads(r'''["この魚、揚げたらネズミに変身!?","皮を残して、身だけ細かく切る。","水気を取って粉をまぶす。","油で揚げると、切り込みがパッと開く！","皮でつながっているから崩れず、まるで毛並みに！","油を切って、","耳と目としっぽを付けたら、ネズミそっくり！"]''')
          style = "成人男性、明るく力強い熱血系の日本語YouTube Shortsナレーション。中音域でエネルギッシュ、テンポ良く、非常に聞き取りやすい。軽快で、誇張した叫びや怒鳴り声は使わない。発見への驚きを表現する。次の文章を一字一句変更せず省略せず読み上げ、指示文は読み上げない。"
          assert len(approved)==7
          assert os.getenv('GEMINI_API_KEY'), 'Secret missing'
          out=pathlib.Path('voice_outputs/tic_mouse_fish_20261110_08g_retry')
          out.mkdir(parents=True,exist_ok=True)
          def render(item):
              i,s=item
              lid=f'a{i:02d}'
              models=['gemini-3.8-flash-tts','gemini-3.8-flash-tts','gemini-3.8-flash-lite-tts','gemini-3.1-flash-tts-preview']
              reasons=[]
              for k,model in enumerate(models,1):
                  target=pathlib.Path('voice_requests')/f'tic_mouse_fish_20261110_retry_{lid}_{k}.json'
                  target.parent.mkdir(exist_ok=True)
                  target.write_text(json.dumps({'text':s,'profile':{'model':model,'voice_name':'Puck','style':style}},ensure_ascii=False),encoding='utf-8')
                  try:
                      p=subprocess.run([sys.executable,'scripts/run_voice_request.py',str(target)],capture_output=True,text=True,timeout=105)
                  except subprocess.TimeoutExpired:
                      reasons.append(f'{model}:timeout')
                      continue
                  if p.returncode:
                      reasons.append(f'{model}:{(p.stderr or p.stdout)[-300:]}')
                      continue
                  src=pathlib.Path('voice_outputs')/target.stem/'voice.wav'
                  if not src.is_file() or src.stat().st_size<1000:
                      reasons.append(f'{model}:wav missing'); continue
                  dest=out/f'{lid}.wav'
                  shutil.copy2(src,dest)
                  with wave.open(str(dest),'rb') as w: duration=w.getnframes()/w.getframerate(); rate=w.getframerate(); nc=w.getnchannels()
                  return {'id':lid,'text':s,'model':model,'duration_sec':round(duration,6),'sample_rate':rate,'channels':nc,'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest()},None
              return None,{'id':lid,'failures':reasons}
          manifest={'sdk':'google-genai==2.25.0','voice':'Puck','approved_lines':approved,'approved_sha256':hashlib.sha256('\n'.join(approved).encode('utf-8')).hexdigest(),'lines':[],'failures':[]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              futures={executor.submit(render,item):item[0] for item in enumerate(approved,1)}
              for f in concurrent.futures.as_completed(futures):
                  entry,err=f.result()
                  if entry: manifest['lines'].append(entry); print('OK',entry['id'],entry['model'],entry['duration_sec'],flush=True)
                  else: manifest['failures'].append(err); print('FAIL',json.dumps(err,ensure_ascii=False),flush=True)
                  manifest['lines'].sort(key=lambda x:x['id'])
                  (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          assert [r['id'] for r in manifest['lines']]==[f'a{i:02d}' for i in range(1,8)],'Missing WAVs'
          print('SUCCESS seven clips',manifest['approved_sha256'],flush=True)
          PY
      - name: Upload WAVs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-mouse-fish-08g-sdk225-retry
          path: voice_outputs/tic_mouse_fish_20261110_08g_retry/
          if-no-files-found: error
          retention-days: 30
