name: TIC Oolong 08G Gemini Puck SDK225 Parallel Rescue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-oolong-08g-parallel-sdk225.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proven pinned SDK
        run: python -m pip install -q 'google-genai==2.25.0'
      - name: Generate 12 approved segments without speed alteration
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import json, pathlib, os, subprocess, sys, time, wave, hashlib, concurrent.futures
          source=pathlib.Path('voice_batches/tic_oolong_udon_baked_milk_20261111_08g_v1.json')
          req=json.loads(source.read_text(encoding='utf-8'))
          lines=req['lines']
          profile=req['profile']
          assert len(lines)==12 and profile['voice_name']=='Puck' and profile['model']=='gemini-3.8-flash-tts'
          assert os.environ.get('GEMINI_API_KEY'), 'Missing Gemini API key'
          out=pathlib.Path('voice_outputs/tic_oolong_udon_baked_milk_20261111_08g_rescue225')
          out.mkdir(parents=True,exist_ok=True)
          approved='\n'.join(line['text'] for line in lines)
          (out/'approved_script.txt').write_text(approved+'\n',encoding='utf-8')
          print('Approved text sha256:',hashlib.sha256(approved.encode()).hexdigest(),flush=True)
          def gen(row):
              lid=row['id']
              wav=out/(lid+'.wav')
              payload={'text':row['text'],'output_path':str(wav.resolve()),'profile':profile}
              last=''
              for attempt in range(1,5):
                  try:
                      p=subprocess.run([sys.executable,'examples/gemini_voice_command.py'],input=json.dumps(payload,ensure_ascii=False),text=True,capture_output=True,timeout=175)
                      if p.returncode==0 and wav.exists() and wav.stat().st_size>1000:
                          with wave.open(str(wav),'rb') as w:
                              duration=w.getnframes()/w.getframerate()
                              assert duration>0.3 and w.getnframes()>1000
                          print('OK',lid,round(duration,3),'seconds',flush=True)
                          return (lid,duration,'')
                      last=(p.stderr or 'No WAV')[-350:]
                  except Exception as exc:
                      last=repr(exc)[-350:]
                  print('RETRY',lid,attempt,last,flush=True)
                  wav.unlink(missing_ok=True)
                  time.sleep(9*attempt)
              return (lid,0,last)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results=list(pool.map(gen,lines))
          manifest={lid:round(duration,5) for lid,duration,error in results if duration>0}
          failed={lid:error for lid,duration,error in results if not duration}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (out/'failed.json').write_text(json.dumps(failed,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('COMPLETE',len(manifest),'FAILED',len(failed),flush=True)
          if len(manifest)!=12:
              raise SystemExit('Incomplete TTS generation; see failed.json')
          PY
      - name: Upload WAVs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-oolong-08g-rescue-sdk225
          path: voice_outputs/tic_oolong_udon_baked_milk_20261111_08g_rescue225/
          if-no-files-found: error
          retention-days: 30
