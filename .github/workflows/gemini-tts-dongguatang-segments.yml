name: Gemini Dongguatang Segments

on:
  push:
    branches: [tts-dongguatang-retry]
    paths:
      - 'voice_requests/dongguatang_segments_manifest.json'

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: gemini-3.8-flash-tts
      GEMINI_TTS_VOICE: Fenrir
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Gemini SDK only
        run: python -m pip install 'google-genai>=2.25.0'
      - name: Generate 15 voice segments
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, pathlib, time
          manifest = json.loads(pathlib.Path("voice_requests/dongguatang_segments_manifest.json").read_text(encoding="utf-8"))
          out = pathlib.Path("segment_outputs")
          out.mkdir(exist_ok=True)
          profile = manifest["profile"]
          results = []
          for idx, seg in enumerate(manifest["segments"], 1):
              sid = f"{idx:02d}"
              wav = out / f"{sid}.wav"
              req = {"text": seg["text"], "output_path": str(wav.resolve()), "profile": profile}
              last_err = ""
              for attempt in range(1, 4):
                  try:
                      p = subprocess.run(
                          [sys.executable, "examples/gemini_voice_command.py"],
                          input=json.dumps(req, ensure_ascii=False),
                          text=True, capture_output=True, timeout=120
                      )
                  except subprocess.TimeoutExpired:
                      last_err = "timeout"
                      continue
                  if p.returncode == 0:
                      meta = json.loads(p.stdout)
                      results.append({"id": sid, "text": seg["text"], **meta})
                      break
                  last_err = p.stderr.strip()
              else:
                  raise SystemExit(f"segment {sid} failed: {last_err}")
          (out/"segments.json").write_text(json.dumps(results, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY
      - name: Upload segments
        uses: actions/upload-artifact@v4
        with:
          name: gemini-dongguatang-segments
          path: segment_outputs/
          if-no-files-found: error
          retention-days: 30
