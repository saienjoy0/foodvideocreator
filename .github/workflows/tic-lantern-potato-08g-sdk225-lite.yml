name: TIC Lantern Potato 08G Puck SDK225 Lite Fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tic-lantern-potato-08g-sdk225-lite.yml']
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Google SDK
        run: python -m pip install 'google-genai==2.25.0'
      - name: Verify request
        run: |
          python - <<'PY'
          import json
          r=json.load(open('voice_batches/tic_lantern_potato_20261122_08g_lite_v2.json',encoding='utf-8'))
          assert len(r['lines'])==9 and r['profile']['voice_name']=='Puck'
          assert r['profile']['model']=='gemini-3.8-flash-lite-tts'
          PY
      - name: Generate WAVs with fallback TTS
        shell: bash
        timeout-minutes: 9
        run: timeout 510s python -u scripts/run_voice_batch.py voice_batches/tic_lantern_potato_20261122_08g_lite_v2.json
      - name: Verify all WAVs
        run: |
          python - <<'PY'
          import json,wave
          from pathlib import Path
          d=Path('voice_outputs/tic_lantern_potato_20261122_08g_lite_v2')
          m=json.loads((d/'manifest.json').read_text())
          assert len(m)==9,m
          for i in range(1,10):
             with wave.open(str(d/f'a{i:02d}.wav'),'rb') as w:
                assert w.getnframes()>0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tic-lantern-potato-08g-lite-sdk225
          path: voice_outputs/tic_lantern_potato_20261122_08g_lite_v2/
          if-no-files-found: warn
          retention-days: 30
