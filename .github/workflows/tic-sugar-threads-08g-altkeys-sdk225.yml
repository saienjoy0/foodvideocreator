name: TIC Sugar Threads 08G Alternate Repo Secrets SDK225
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-sugar-threads-08g-altkeys-sdk225.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY_PRIMARY: ${{ secrets.GEMINI_API_KEY }}
      KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      KEY_A2: ${{ secrets.GEMINI_API_KEY2 }}
      KEY_A3: ${{ secrets.GEMINI_API_KEY3 }}
      KEY_A4: ${{ secrets.GEMINI_API_KEY4 }}
      KEY_A5: ${{ secrets.GEMINI_API_KEY5 }}
      KEY_SUB: ${{ secrets.GEMINI_API_KEY_SUB }}
      KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
      KEY_GOOGLE: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin successful SDK
        run: python -m pip install 'google-genai==2.25.0'
      - name: Find an authorized usable secret and synthesize verbatim lines
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import os,sys,json,subprocess,hashlib,pathlib,wave
          req=json.loads(pathlib.Path("voice_batches/tic_sugar_threads_20261122_08g_v1.json").read_text(encoding="utf-8"))
          approved=["まるで、空から降る蜘蛛の糸！","熱い砂糖なら、細く伸ばすと","空中で冷えて、そのまま固まる。","こうして料理を包む、繊細な飾りに。"]
          assert [l["text"] for l in req["lines"]]==approved and req["profile"]["voice_name"]=="Puck"
          out=pathlib.Path("voice_outputs/tic_sugar_threads_20261122_08g_altkeys")
          out.mkdir(parents=True,exist_ok=True)
          aliases=["KEY_PRIMARY","KEY_1","KEY_2","KEY_3","KEY_4","KEY_5","KEY_A2","KEY_A3","KEY_A4","KEY_A5","KEY_SUB","KEY_BACKUP","KEY_GOOGLE"]
          import re
          def split_secret(secret):
            secret=secret.strip()
            if not secret:
              return []
            try:
              parsed=json.loads(secret)
              if isinstance(parsed,list):
                pieces=[str(x) for x in parsed]
              elif isinstance(parsed,dict):
                pieces=[str(x) for x in parsed.values()]
              else:
                pieces=[secret]
            except (ValueError,TypeError):
              pieces=[secret]
            result=[]
            for piece in pieces:
              for token in re.split(r"[,;\\s]+",piece):
                token=token.strip(" \\t\\r\\n\\\"'")
                if "=" in token:
                  token=token.split("=",1)[1].strip(" \\t\\r\\n\\\"'")
                if token and token not in ("[","]","{","}"):
                  result.append(token)
            return result
          keys=list(dict.fromkeys(k for alias in aliases for k in split_secret(os.environ.get(alias,""))))
          print("Unique configured keys:",len(keys),flush=True)
          if not keys:raise SystemExit("No configured Gemini key")
          manifest={"sdk":"google-genai==2.25.0","model":req["profile"]["model"],"voice":"Puck","script_sha256":hashlib.sha256("\n".join(approved).encode("utf-8")).hexdigest(),"segments":[]}
          for line in req["lines"]:
            wav=out/(line["id"]+".wav")
            preq={"text":line["text"],"profile":req["profile"],"output_path":str(wav.resolve())}
            success=False
            for ki,key in enumerate(keys):
              env=dict(os.environ,GEMINI_API_KEY=key)
              try:
                p=subprocess.run([sys.executable,"examples/gemini_voice_command.py"],input=json.dumps(preq,ensure_ascii=False),text=True,capture_output=True,env=env,timeout=135)
              except subprocess.TimeoutExpired:
                print("Key index",ki+1,"timeout",line["id"],flush=True)
                continue
              if p.returncode==0 and wav.exists() and wav.stat().st_size>1000:
                with wave.open(str(wav),"rb") as w:
                  sec=w.getnframes()/w.getframerate()
                print("OK",line["id"],"seconds",round(sec,3),"key index",ki+1,flush=True)
                manifest["segments"].append({"id":line["id"],"text":line["text"],"seconds":sec,"wav":wav.name})
                success=True
                break
              msg=p.stderr or ""
              if "API_KEY_INVALID" in msg: reason="INVALID"
              elif "monthly spending cap" in msg: reason="SPEND_CAP"
              elif "429" in msg: reason="RATE_LIMIT"
              else: reason="OTHER("+msg[-180:].replace("\n"," ")+")"
              print("KEY",ki+1,"FAILED",line["id"],reason,flush=True)
            if not success:raise SystemExit("No usable Gemini credential for "+line["id"])
          (out/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print("ALL FOUR WAVs OK",flush=True)
          PY
      - name: Upload WAVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-sugar-threads-08g-altkeys-sdk225
          path: voice_outputs/tic_sugar_threads_20261122_08g_altkeys/
          if-no-files-found: warn
          retention-days: 30

# Retry approved sugar threads narration after user updated GitHub Gemini key (2026-11-28)
