name: TIC Egg Sticks 08G Missing Five Natural v4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-egg-sticks-08g-rescue-missing-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KEY_MAIN: ${{ secrets.GEMINI_API_KEY }}
      KEY_ALT1: ${{ secrets.GEMINI_API_KEY_1 }}
      KEY_ALT2: ${{ secrets.GEMINI_API_KEY_2 }}
      KEY_ALT3: ${{ secrets.GEMINI_API_KEY_3 }}
      KEY_ALT4: ${{ secrets.GEMINI_API_KEY_4 }}
      KEY_ALT5: ${{ secrets.GEMINI_API_KEY_5 }}
      KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact google-genai SDK 2.25.0
        run: python -m pip install -q 'google-genai==2.25.0'
      - name: Rescue only missing approved Japanese lines without speedup
        shell: bash
        run: |
          set -o pipefail
          mkdir -p voice_outputs/tic_egg_sticks_20261110_missing_v4
          python -u - <<'PY' 2>&1 | tee voice_outputs/tic_egg_sticks_20261110_missing_v4/run.log
          import os,sys,json,hashlib,pathlib,subprocess,concurrent.futures as cf,shutil,wave,time
          batch=pathlib.Path('voice_batches/tic_egg_sticks_20261110_natural_short_v2.json')
          req=json.loads(batch.read_text(encoding='utf-8'))
          ids=['a03','a04','a08','a10','a11']
          rows=[row for row in req['lines'] if row['id'] in ids]
          assert len(rows)==5 and req['profile']['voice_name']=='Puck'
          keys=list(dict.fromkeys(k for k in [os.getenv('KEY_MAIN'),os.getenv('KEY_ALT1'),os.getenv('KEY_ALT2'),os.getenv('KEY_ALT3'),os.getenv('KEY_ALT4'),os.getenv('KEY_ALT5'),os.getenv('KEY_BACKUP')] if k))
          if not keys:raise SystemExit('Missing Gemini credentials')
          print('API key slots available:',len(keys),flush=True)
          out=pathlib.Path('voice_outputs/tic_egg_sticks_20261110_missing_v4')
          out.mkdir(parents=True,exist_ok=True)
          models=['gemini-3.8-flash-tts','gemini-3.1-flash-tts-preview','gemini-3.8-flash-lite-tts','gemini-3.1-flash-tts-preview']
          def render(row):
            lid=row['id']; errs=[]
            for attempt,model in enumerate(models):
              k=keys[(ids.index(lid)+attempt)%len(keys)]
              prof=dict(req['profile'],model=model)
              payload={'text':row['text'],'profile':prof,'output_path':str((out/(lid+'.wav')).resolve())}
              env=dict(os.environ,GEMINI_API_KEY=k)
              try:
                p=subprocess.run([sys.executable,'examples/gemini_voice_command.py'],input=json.dumps(payload,ensure_ascii=False),text=True,capture_output=True,env=env,timeout=100)
                if p.returncode:raise RuntimeError((p.stderr or 'provider error')[-250:])
                w=out/(lid+'.wav')
                if not w.is_file() or w.stat().st_size<1500:raise RuntimeError('WAV missing')
                with wave.open(str(w),'rb') as f:dur=f.getnframes()/f.getframerate();rate=f.getframerate()
                return {'id':lid,'text':row['text'],'model':model,'duration':round(dur,5),'rate':rate,'sha256':hashlib.sha256(w.read_bytes()).hexdigest()},None
              except Exception as e:
                errs.append(f'{model}: {type(e).__name__} {str(e)[-260:]}')
                (out/(lid+'.wav')).unlink(missing_ok=True)
            return None,{'id':lid,'errors':errs}
          manifest={'sdk':'google-genai==2.25.0','voice':'Puck','natural_speed':True,'atempo_applied':False,'lines':[],'failed':[]}
          with cf.ThreadPoolExecutor(max_workers=3) as pool:
            fs=[pool.submit(render,row) for row in rows]
            for f in cf.as_completed(fs):
              good,bad=f.result()
              if good:manifest['lines'].append(good);print('OK',good['id'],good['model'],good['duration'],flush=True)
              else:manifest['failed'].append(bad);print('FAILED',bad,flush=True)
              (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if len(manifest['lines'])!=5:raise SystemExit('Missing '+str(5-len(manifest['lines']))+' voice lines')
          print('ALL FIVE WAVS READY',flush=True)
          PY
      - name: Save successful WAVs plus manifest even if partial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-egg-sticks-missing-five-v4
          path: voice_outputs/tic_egg_sticks_20261110_missing_v4/
          retention-days: 30
          if-no-files-found: error
