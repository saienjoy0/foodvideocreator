name: TIC Egg Sticks 08G Four Missing GEMINI Natural 20261110
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-egg-sticks-08g-recover-four-nov10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        number: [3, 4, 10, 11]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NUM: ${{ matrix.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin proven SDK 2.25.0
        run: python -m pip install -q 'google-genai==2.25.0'
      - name: Generate only one approved short Japanese line, natural Puck speed
        shell: bash
        run: |
          set -o pipefail
          mkdir -p voice_outputs/tic_egg_sticks_20261110_recover_four
          python -u - <<'PY' 2>&1 | tee voice_outputs/tic_egg_sticks_20261110_recover_four/run_${NUM}.log
          import json,os,pathlib,subprocess,sys,wave,hashlib
          request=pathlib.Path("voice_batches/tic_egg_sticks_20261110_natural_short_v2.json")
          obj=json.loads(request.read_text(encoding="utf-8"))
          assert len(obj["lines"])==11 and obj["profile"]["voice_name"]=="Puck"
          i=int(os.environ["NUM"])
          row=obj["lines"][i-1]
          assert row["id"]==f"a{i:02d}"
          out=pathlib.Path("voice_outputs/tic_egg_sticks_20261110_recover_four")
          dest=out/(row["id"]+".wav")
          models=["gemini-2.5-flash-preview-tts","gemini-3.1-flash-tts-preview","gemini-3.8-flash-lite-tts"]
          errs=[]
          for model in models:
              req={"text":row["text"],"output_path":str(dest.resolve()),"profile":dict(obj["profile"],model=model)}
              try:
                  p=subprocess.run([sys.executable,"examples/gemini_voice_command.py"],
                       input=json.dumps(req,ensure_ascii=False),text=True,capture_output=True,timeout=115)
                  if p.returncode:
                      raise RuntimeError((p.stderr or p.stdout or "failed")[-500:])
                  if not dest.exists() or dest.stat().st_size<1500:
                      raise RuntimeError("WAV absent")
                  with wave.open(str(dest),"rb") as w:
                      seconds=w.getnframes()/w.getframerate()
                      hz=w.getframerate()
                  record={"id":row["id"],"text":row["text"],"duration_sec":seconds,"model":model,
                    "voice":"Puck","sdk":"google-genai==2.25.0","natural_speed":True,
                    "atempo_applied":False,"sha256":hashlib.sha256(dest.read_bytes()).hexdigest(),"hz":hz,
                    "status":"success"}
                  (out/(row["id"]+".json")).write_text(json.dumps(record,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
                  print("SUCCESS",row["id"],model,seconds,flush=True)
                  break
              except Exception as e:
                  errs.append({"model":model,"err":str(e)[-500:]})
                  print("FAILED",row["id"],model,str(e)[-280:],flush=True)
                  dest.unlink(missing_ok=True)
          else:
              (out/(row["id"]+".json")).write_text(json.dumps({"id":row["id"],"text":row["text"],"status":"failed","errors":errs},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              sys.exit(1)
          PY
      - name: Upload this line WAV and manifest even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egg-sticks-recover-four-${{ matrix.number }}
          path: voice_outputs/tic_egg_sticks_20261110_recover_four/
          retention-days: 30
          if-no-files-found: warn
