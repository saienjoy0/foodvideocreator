name: TIC Oil Dumplings 08G Gemini TTS Pinned SDK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tic-oil-dumplings-08g-pinned-sdk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin Gemini SDK to October success generation
        run: python -m pip install 'google-genai==2.25.0'
      - name: Reuse approved 5-line transcript and try eligible Gemini TTS models
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,sys,pathlib
          src=pathlib.Path('voice_requests/tic_oil_dumplings_20261109_direct_recovery.json')
          req=json.loads(src.read_text(encoding='utf-8'))
          assert req['text'].splitlines() == [
            "この餃子、タレにつけないって知ってた？",
            "茹でた餃子に唐辛子をたっぷり！刻んだ薬味も加える。",
            "そこへ熱い油をジュワッ！餃子の上で直接タレを作る。",
            "白ごまを加え、全体を混ぜれば味がしっかり絡む！",
            "しかも冷凍餃子でも、茹でて味付けすれば再現できる！",
          ],"Transcript mismatch"
          out=pathlib.Path('voice_outputs/tic_oil_dumplings_20261109_pinned_sdk')
          out.mkdir(parents=True,exist_ok=True)
          if not os.getenv('GEMINI_API_KEY'): raise SystemExit('API key missing')
          models=['gemini-3.8-flash-tts','gemini-3.8-flash-lite-tts','gemini-2.5-flash-preview-tts','gemini-2.5-pro-preview-tts','gemini-3.1-flash-tts-preview']
          results=[]
          for model in models:
              req['profile']['model']=model
              request_path=pathlib.Path('voice_requests/tic_oil_dumplings_20261109_pinned_sdk.json')
              request_path.write_text(json.dumps(req,ensure_ascii=False,indent=2),encoding='utf-8')
              print('Trying model:',model,flush=True)
              try:
                  p=subprocess.run([sys.executable,'scripts/run_voice_request.py',str(request_path)],capture_output=True,text=True,timeout=160)
                  if p.returncode==0:
                      wav=pathlib.Path('voice_outputs/tic_oil_dumplings_20261109_pinned_sdk/voice.wav')
                      if not wav.is_file() or wav.stat().st_size<1000: raise ValueError('No WAV')
                      results.append({'model':model,'success':True,'bytes':wav.stat().st_size})
                      print('SUCCESS:',model,'WAV bytes:',wav.stat().st_size,flush=True)
                      break
                  err=p.stderr[-700:]
                  results.append({'model':model,'success':False,'error':err})
                  print('FAILED:',model,err[-400:],flush=True)
              except Exception as e:
                  results.append({'model':model,'success':False,'error':str(e)[:500]})
                  print('EXCEPTION:',model,str(e)[:350],flush=True)
          (out/'attempts.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          if not any(v['success'] for v in results):raise SystemExit('ALL_TTS_MODELS_FAILED')
          PY
      - name: Upload WAV and model diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tic-oil-dumplings-08g-pinned-sdk
          path: voice_outputs/tic_oil_dumplings_20261109_pinned_sdk/
          if-no-files-found: error
          retention-days: 30
